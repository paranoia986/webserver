<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:36px 40px;width:340px;text-align:center}
.card h2{font-size:1.3rem;margin-bottom:6px}.card h2 span{color:var(--green)}
.card .sub{color:var(--muted);font-size:0.8rem;margin-bottom:24px}
.card input{width:100%;padding:10px 14px;margin-bottom:12px;border-radius:8px;border:1px solid var(--border);background:#0d1117;color:var(--text);font-size:0.9rem;outline:none;transition:border-color .15s}
.card input:focus{border-color:var(--green)}
.card button{width:100%;padding:10px;border-radius:8px;font-size:0.9rem;cursor:pointer;border:1px solid var(--green);background:rgba(63,185,80,0.1);color:var(--green);font-weight:600;transition:background .15s}
.card button:hover{background:rgba(63,185,80,0.2)}
.back{margin-top:20px;color:var(--muted);font-size:0.8rem}.back a{color:var(--blue);text-decoration:none}
</style></head><body>
<div class="card">
    <h2>Web<span>Server</span></h2>
    <p class="sub">创建新账号</p>
    <form action="3CGISQL.cgi" method="post">
        <input type="text" name="user" placeholder="用户名" required>
        <input type="password" name="password" placeholder="用户密码" required>
        <button type="submit">🆕 注册</button>
    </form>
</div>
<div class="back"><a href="/">← 返回首页</a></div>
</body></html>
