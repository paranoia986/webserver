<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WebServer</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero{text-align:center;padding:30px 20px}
.hero h1{font-size:2rem;font-weight:700;margin-bottom:6px}.hero h1 span{color:var(--green)}
.hero .sub{color:var(--muted);font-size:0.95rem;margin-bottom:28px}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:24px}
.btn{padding:11px 24px;border-radius:10px;font-size:0.9rem;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);transition:border-color .15s,transform .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-2px)}
.btn.primary{border-color:var(--blue);color:var(--blue)}
.btn.primary:hover{background:rgba(88,166,255,0.06)}
.divider{width:40px;height:1px;background:var(--border);margin:20px auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px 32px;max-width:280px;margin:0 auto;text-align:center}
.card h4{color:var(--muted);font-size:0.78rem;margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.card form{margin-bottom:10px}.card form:last-child{margin-bottom:0}
.card button{width:100%;padding:9px;border-radius:7px;font-size:0.85rem;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted);transition:border-color .15s,color .15s}
.card button:hover{border-color:var(--blue);color:var(--text)}
.footer{position:fixed;bottom:14px;color:var(--muted);font-size:0.7rem}
.footer a{color:var(--blue);text-decoration:none}
</style></head><body>
<div class="hero">
    <h1>🎉 Welcome to <span>WebServer</span></h1>
    <p class="sub">登录成功！选择一个操作</p>
</div>
<div class="btns">
    <a class="btn primary" href="/dashboard.html">📊 实时监控 Dashboard</a>
    <a class="btn" href="https://github.com/paranoia986/webserver" target="_blank">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub Repo
    </a>
    <a class="btn" href="/index.html">📂 文件仓库</a>
</div>
<div class="divider"></div>
<div class="card">
    <h4>📂 文件预览</h4>
    <form action="5" method="post"><button>🖼️ 图片画廊</button></form>
    <form action="6" method="post"><button>🎬 神秘视频</button></form>
</div>
<footer class="footer"><a href="https://github.com/paranoia986/webserver" target="_blank">GitHub</a></footer>
</body></html>
