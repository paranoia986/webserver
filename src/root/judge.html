<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WebServer</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero{text-align:center;padding:40px 20px}
.hero h1{font-size:2.8rem;font-weight:800;letter-spacing:-1px;margin-bottom:8px}
.hero h1 span{color:var(--blue)}
.hero .tagline{color:var(--muted);font-size:1.05rem;margin-bottom:36px}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:30px}
.btn{padding:12px 28px;border-radius:10px;font-size:0.95rem;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);transition:border-color .2s,transform .15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px)}
.btn.primary{border-color:var(--blue);color:var(--blue)}
.btn.primary:hover{background:rgba(88,166,255,0.08)}
.btn.gh{border-color:var(--muted);color:var(--muted)}
.btn.gh:hover{border-color:var(--text);color:var(--text)}
.divider{width:60px;height:1px;background:var(--border);margin:28px auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px 36px;max-width:340px;margin:0 auto}
.card h3{color:var(--muted);font-size:0.85rem;margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px}
.card form{margin-bottom:12px}
.card form:last-child{margin-bottom:0}
.card button{width:100%;padding:10px;border-radius:8px;font-size:0.9rem;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text);transition:border-color .15s,background .15s}
.card button:hover{border-color:var(--blue);background:rgba(88,166,255,0.06)}
.card button.register{background:rgba(63,185,80,0.08);border-color:var(--green);color:var(--green)}
.footer{position:fixed;bottom:16px;color:var(--muted);font-size:0.7rem}
.footer a{color:var(--blue);text-decoration:none}
</style></head><body>
<div class="hero">
    <h1>⚡ Web<span>Server</span></h1>
    <p class="tagline">高性能 C++ HTTP 服务器 · io_uring 异步 I/O · 零内存泄漏</p>
</div>

<div class="btns">
    <a class="btn gh" href="https://github.com/paranoia986/webserver" target="_blank">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub Repo
    </a>
</div>

<div class="divider"></div>

<div class="card">
    <h3>👤 账号入口</h3>
    <form action="0" method="post"><button class="register">🆕 新用户注册</button></form>
    <form action="1" method="post"><button>🔑 已有账号登录</button></form>
</div>

<footer class="footer">C++17 · io_uring &amp; epoll · <a href="https://github.com/paranoia986/webserver" target="_blank">GitHub</a></footer>
</body></html>
