<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gallery</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--blue:#58a6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--card)}
.header h1{font-size:1.25rem}.header h1 span{color:var(--blue)}
.back{color:var(--blue);text-decoration:none;font-size:0.85rem;padding:6px 14px;border:1px solid var(--border);border-radius:6px}
.back:hover{border-color:var(--blue)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px;padding:24px 28px;max-width:1100px;margin:0 auto}
.pic-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s}
.pic-card:hover{border-color:var(--blue)}
.pic-card img{width:100%;height:auto;display:block}
.pic-card .cap{text-align:center;padding:12px;color:var(--muted);font-size:0.82rem;border-top:1px solid var(--border)}
</style></head><body>
<div class="header">
    <h1>🖼️ Image <span>Gallery</span></h1>
    <a class="back" href="/welcome.html">← 返回</a>
</div>
<div class="gallery">
    <div class="pic-card">
        <img src="/wolf.jpg" alt="wolf">
        <div class="cap">wolf.jpg</div>
    </div>
    <div class="pic-card">
        <img src="/huiye.png" alt="huiye">
        <div class="cap">huiye.png</div>
    </div>
</div>
</body></html>
